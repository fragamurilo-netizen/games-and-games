<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudos de anatomia · PARALELO</title><style>
body{background:#151815;color:#efeee2;font:14px/1.5 system-ui;margin:0;padding:30px}main{max-width:1300px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:42px}h2{margin-top:40px}p,a{color:#a5ac9e}a{color:#c2da9b}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}.ages{grid-template-columns:repeat(8,minmax(0,1fr))}.wardrobe{grid-template-columns:repeat(8,minmax(0,1fr))}figure{margin:0}svg{display:block;width:100%;height:auto}figcaption{font-size:11px;margin:8px 0}label{display:inline-block;margin:10px 24px 10px 0}input{accent-color:#c2da9b}@media(max-width:800px){.grid,.ages,.wardrobe{grid-template-columns:repeat(4,minmax(0,1fr))}body{padding:18px}}@media(max-width:430px){.grid,.wardrobe{grid-template-columns:repeat(2,minmax(0,1fr))}.ages{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main><a href="./">← Voltar ao ateliê</a><h1>Uma base. Muitos corpos.</h1><p>Folha de revisão visual para comparar anatomia, idade, peso e encaixe das roupas com o mesmo renderizador do laboratório.</p><label>Idade <input id="age" type="range" min="20" max="90" value="30"><output id="age-value">30</output></label><h2>Mulheres e homens / constituições diferentes</h2><div class="grid" id="bodies"></div><h2>Rosto ao longo da vida</h2><div class="grid ages" id="ages"></div><h2>Vestuário / a mesma anatomia</h2><div class="grid wardrobe" id="outfits"></div></main>
<script src="faces-core.js?v=7"></script><script src="character-catalog.js?v=7"></script><script src="vector-body.js?v=7"></script><script src="vector-wardrobe.js?v=7"></script><script src="vector-character.js?v=7"></script><script>
const C=FaceCore,R=VectorCharacter,g={F:C.makeGenome('rua-das-flores-12',{sex:'F'}),M:C.makeGenome('rua-das-flores-12',{sex:'M'})};
function tile(el,g,opts,label){const f=document.createElement('figure');f.innerHTML=R.build(g,opts).svg;const cap=document.createElement('figcaption');cap.textContent=label;f.append(cap);el.append(f)}
function draw(){const age=+document.getElementById('age').value;document.getElementById('age-value').textContent=age;const el=document.getElementById('bodies');el.replaceChildren();for(const sex of ['F','M'])for(const fat of [0,.35,.7,1])tile(el,g[sex],{age,fat,muscle:.35,view:'body',outfit:sex==='F'?'blouse':'polo',hair:sex==='F'?'longo-ondulado':'topete',beard:'nenhuma',glasses:null},(sex==='F'?'Mulher':'Homem')+' · constituição '+Math.round(fat*100)+'%')}
draw();document.getElementById('age').addEventListener('input',draw);for(const age of [0,3,8,15,25,50,75,110])tile(document.getElementById('ages'),g.F,{age,glasses:null},age+' anos');for(const [id,o]of Object.entries(R.OUTFITS))tile(document.getElementById('outfits'),id==='formal'||id==='polo'||id==='blazer'?g.M:g.F,{age:30,fat:.35,view:'body',outfit:id,glasses:null,beard:'nenhuma',hair:id==='formal'||id==='polo'||id==='blazer'?'social-curto':'coque-baixo'},o.name)
</script></body></html>
