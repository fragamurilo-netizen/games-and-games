name: Corner Office

on:
  push:
    paths: ["corner-office/**", ".github/workflows/corner-office.yml"]
  pull_request:
    paths: ["corner-office/**", ".github/workflows/corner-office.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Run tests
        run: corner-office/tools/run_tests.sh
