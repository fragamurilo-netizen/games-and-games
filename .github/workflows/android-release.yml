name: Android release (AAB)
# Gera o AAB assinado para a Google Play. Rode em Actions → "Android release (AAB)" → Run workflow
# (depois que este arquivo estiver no branch padrão) ou crie uma tag v0.4.0.
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  o arquivo .jks da chave de upload em base64 (base64 -w0 chave.jks)
#   ANDROID_UPLOAD_KEY_ALIAS        o alias da chave (ex.: upload)
#   ANDROID_UPLOAD_KEY_PASSWORD     a senha
# A chave nunca entra no repositório.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mais-uma-rodada
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot e modelos de exportação
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm tpl.tpz

      - name: Android SDK (plataforma e build-tools 36)
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          CFG

      - name: Modelo de build Android (Gradle)
        run: |
          set -euo pipefail
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version

      - name: Conferir publicação
        run: python3 tools/release_check.py

      - name: Importar e testar o boot
        run: |
          set -euo pipefail
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --script res://tests/smoke_boot.gd 2>&1 | tee boot.log || true
          grep -q "SMOKE_BOOT_OK" boot.log

      - name: Exportar AAB assinado
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Faltam os segredos da chave de upload (veja o topo deste arquivo)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.jks" \
          GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS" \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEY_PASSWORD" \
            godot --headless --path . --export-release "Android" "build/MaisUmaRodada-${VERSION}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la build
          test -s "build/MaisUmaRodada-${VERSION}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: mais-uma-rodada/build/*.aab
          if-no-files-found: error
