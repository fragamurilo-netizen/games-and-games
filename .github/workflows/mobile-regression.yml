name: Mobile fixes regression and APK
on:
  push:
    branches: [codex/mobile-performance-0.4.1-20260928]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Import, regression tests, and Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation mais-uma-rodada/build
          git rev-parse HEAD > validation/source-commit.txt
          # A chave debug do CI difere da usada no APK original. Este pacote de teste
          # instala ao lado do jogo, com dados separados, sem exigir desinstalação.
          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path("mais-uma-rodada/export_presets.cfg")
          text = p.read_text()
          old = 'package/unique_name="com.maisumarodada.futebol"'
          assert text.count(old) == 2, "Unexpected Android export presets"
          text = text.replace(old, 'package/unique_name="com.maisumarodada.futebol.mobiletest"')
          text = text.replace('package/name="Mais Uma Rodada"', 'package/name="Mais Uma Rodada Teste"')
          p.write_text(text)
          PYCONFIG
          git diff -- mais-uma-rodada/export_presets.cfg > validation/test-package.patch
          docker run --rm -v "$PWD:/workspace" -w /workspace/mais-uma-rodada \
            barichello/godot-ci:4.7 bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends libfontconfig1 > /workspace/validation/dependencies.log
              godot --version | tee /workspace/validation/engine.txt
              timeout 300s godot --headless --path . --import 2>&1 | tee /workspace/validation/import.log
              timeout 180s godot --headless --path . --script res://tests/mobile_regression.gd 2>&1 | tee /workspace/validation/mobile-tests.log
              grep -q MOBILE_REGRESSION_OK /workspace/validation/mobile-tests.log
              if grep -E "SCRIPT ERROR|Parse Error|MOBILE_FAIL" /workspace/validation/mobile-tests.log; then exit 1; fi
              godot --headless --path . --export-debug "Android arm64" build/MaisUmaRodada-0.4.0-mobile-fixes-teste.apk 2>&1 | tee /workspace/validation/export.log
            '
          test -s mais-uma-rodada/build/MaisUmaRodada-0.4.0-mobile-fixes-teste.apk
          sha256sum mais-uma-rodada/build/MaisUmaRodada-0.4.0-mobile-fixes-teste.apk > validation/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-validation-${{ github.sha }}
          path: validation/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MaisUmaRodada-mobile-fixes-teste
          path: mais-uma-rodada/build/MaisUmaRodada-0.4.0-mobile-fixes-teste.apk
          if-no-files-found: error
          retention-days: 14
