name: Review official roster facts
on:
  push:
    branches: [codex/realism-integration-0.5.1-20260929]
    paths: [.github/workflows/roster-review.yml, .ci/collect_public_roster_facts.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python .ci/collect_public_roster_facts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-roster-review
          path: roster-review/
          retention-days: 3
