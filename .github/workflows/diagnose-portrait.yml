name: Diagnose Portrait Parser

on:
  push:
    branches:
      - build/mais-uma-rodada-latest-2026-09-26
    paths:
      - ".github/workflows/diagnose-portrait.yml"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/mais-uma-rodada-latest-2026-09-26
      - name: Parse PortraitView
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/mais-uma-rodada \
            barichello/godot-ci:4.7 \
            godot --headless --path /workspace/mais-uma-rodada \
              --script res://scripts/ui/components/portrait_view.gd --check-only 2>&1 | tee /tmp/portrait.log
