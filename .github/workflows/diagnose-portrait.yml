name: Diagnose Portrait Parser

on:
  push:
    branches:
      - build/mais-uma-rodada-latest-2026-09-26
    paths:
      - ".github/workflows/diagnose-portrait.yml"
      - "mais-uma-rodada/scripts/ui/components/portrait_view.gd"
      - "mais-uma-rodada/scripts/generation/face_gen.gd"
      - "mais-uma-rodada/tools/face_sheet.gd"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/mais-uma-rodada-latest-2026-09-26
      - name: Import project and parse PortraitView
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/mais-uma-rodada \
            barichello/godot-ci:4.7 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends libfontconfig1 >/dev/null
              rm -rf .godot
              godot --headless --path /workspace/mais-uma-rodada --import >/tmp/import.log 2>&1
              godot --headless --path /workspace/mais-uma-rodada \
                --script res://scripts/ui/components/portrait_view.gd --check-only
            '

      - name: Render portrait realism sheet
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/mais-uma-rodada \
            barichello/godot-ci:4.7 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends libfontconfig1 xvfb >/dev/null
              xvfb-run -a godot --path /workspace/mais-uma-rodada --resolution 800x800 \
                --script res://tools/face_sheet.gd -- \
                --out=/workspace/portrait-realism-sheet.png \
                --size=190 --cols=4 --eth=1,4,7,8 --ages=21,24,28,32
            '
          test -s portrait-realism-sheet.png

      - name: Upload portrait realism sheet
        uses: actions/upload-artifact@v4
        with:
          name: portrait-realism-sheet
          path: portrait-realism-sheet.png
          if-no-files-found: error
          retention-days: 14
